<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Tako Memes</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #1a1a2e);
      --text: var(--tg-theme-text-color, #eee);
      --hint: var(--tg-theme-hint-color, #888);
      --accent: var(--tg-theme-button-color, #4ecca3);
      --accent-text: var(--tg-theme-button-text-color, #1a1a2e);
      --card: var(--tg-theme-secondary-bg-color, #16213e);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    h1 { font-size: 1.4rem; margin-bottom: 4px; }

    .subtitle {
      color: var(--hint);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .meme-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .meme-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .meme-card .caption {
      padding: 8px;
      font-size: 0.75rem;
      color: var(--hint);
      text-align: center;
    }

    .empty, .status {
      text-align: center;
      color: var(--hint);
      padding: 16px;
      font-size: 0.85rem;
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--hint);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }

    textarea { resize: vertical; min-height: 80px; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:disabled { opacity: 0.5; }

    .preview {
      margin-top: 10px;
      max-height: 160px;
      border-radius: 10px;
      display: none;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--hint);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>🐙 Мемы Тако</h1>
  <p class="subtitle">Выбери мем или загрузи свой</p>

  <div class="tabs">
    <button class="tab active" data-tab="gallery">Галерея</button>
    <button class="tab" data-tab="submit">Предложить</button>
  </div>

  <div id="gallery" class="panel active">
    <div id="meme-grid" class="grid"></div>
    <p id="gallery-empty" class="empty" style="display:none">Мемов пока нет — предложи первый!</p>
    <p id="gallery-loading" class="status">Загрузка...</p>
  </div>

  <div id="submit" class="panel">
    <div class="form-group">
      <label for="meme-file">Картинка с устройства</label>
      <input id="meme-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
      <img id="meme-preview" class="preview" alt="preview">
    </div>
    <div class="form-group">
      <label for="meme-url">Или ссылка на картинку</label>
      <input id="meme-url" type="url" placeholder="https://.../image.jpg">
    </div>
    <div class="form-group">
      <label for="meme-caption">Подпись (необязательно)</label>
      <textarea id="meme-caption" placeholder="Описание мема..."></textarea>
    </div>
    <button class="btn" id="submit-btn">Отправить на модерацию</button>
    <p class="hint">После отправки смотри ответ бота в чате. Или фото в бот: /submit в подписи.</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function getApiBase() {
      let base = (new URLSearchParams(location.search).get("api")
        || "https://api.memeapp.osminogr.site").trim().replace(/\/$/, "");
      base = base.replace(/\/api\/memes\/?$/i, "");
      return base;
    }

    const API_BASE = getApiBase();

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    const fileInput = document.getElementById("meme-file");
    const preview = document.getElementById("meme-preview");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) {
        preview.style.display = "none";
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    async function loadMemes() {
      const grid = document.getElementById("meme-grid");
      const empty = document.getElementById("gallery-empty");
      const loading = document.getElementById("gallery-loading");

      try {
        const res = await fetch(`${API_BASE}/api/memes`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        loading.style.display = "none";

        if (!data.memes || data.memes.length === 0) {
          empty.style.display = "block";
          return;
        }

        data.memes.forEach(meme => {
          const card = document.createElement("div");
          card.className = "meme-card";
          card.innerHTML = `
            <img src="${meme.url}" alt="meme" loading="lazy">
            ${meme.caption ? `<div class="caption">${meme.caption}</div>` : ""}
          `;
          card.addEventListener("click", () => {
            tg.sendData(JSON.stringify({ action: "send_meme", meme_id: meme.id }));
            tg.close();
          });
          grid.appendChild(card);
        });
      } catch (e) {
        loading.textContent = "Не удалось загрузить мемы: " + API_BASE + "/api/memes";
      }
    }

    async function uploadFile(file) {
      const form = new FormData();
      form.append("file", file);
      const res = await fetch(`${API_BASE}/api/upload`, { method: "POST", body: form });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "Ошибка загрузки");
      }
      const data = await res.json();
      return data.url;
    }

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const btn = document.getElementById("submit-btn");
      const urlInput = document.getElementById("meme-url").value.trim();
      const caption = document.getElementById("meme-caption").value.trim();
      const file = fileInput.files[0];

      if (!file && !urlInput) {
        tg.showAlert("Выбери картинку или вставь ссылку");
        return;
      }

      btn.disabled = true;
      try {
        let url = urlInput;
        if (file) {
          url = await uploadFile(file);
        }

        tg.sendData(JSON.stringify({
          action: "submit_meme",
          url,
          caption
        }));

        tg.showAlert("Отправлено! Проверь чат с ботом.", () => tg.close());
      } catch (e) {
        tg.showAlert("Ошибка: " + e.message);
        btn.disabled = false;
      }
    });

    loadMemes();
  </script>
</body>
</html>
