<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Tako Memes</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #1a1a2e);
      --text: var(--tg-theme-text-color, #eee);
      --hint: var(--tg-theme-hint-color, #888);
      --accent: var(--tg-theme-button-color, #4ecca3);
      --accent-text: var(--tg-theme-button-text-color, #1a1a2e);
      --card: var(--tg-theme-secondary-bg-color, #16213e);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    h1 { font-size: 1.4rem; margin-bottom: 4px; }

    .subtitle {
      color: var(--hint);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .meme-card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .meme-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .meme-card .caption {
      padding: 8px;
      font-size: 0.75rem;
      color: var(--hint);
      text-align: center;
    }

    .empty, .status {
      text-align: center;
      color: var(--hint);
      padding: 16px;
      font-size: 0.85rem;
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--hint);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }

    textarea { resize: vertical; min-height: 80px; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:disabled { opacity: 0.5; }

    .preview {
      margin-top: 10px;
      max-height: 160px;
      border-radius: 10px;
      display: none;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--hint);
      margin-top: 8px;
    }

    .gallery-status {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 10px;
      background: var(--card);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.4;
    }

    .gallery-status.ok { color: var(--accent); }
    .gallery-status.err { color: #ff6b6b; }
    .gallery-status.wait { color: var(--hint); }
  </style>
</head>
<body>
  <h1>🐙 Мемы Тако</h1>
  <p class="subtitle">Выбери мем для стрима или загрузи свой</p>

  <div class="tabs">
    <button class="tab active" data-tab="gallery">Галерея</button>
    <button class="tab" data-tab="submit">Предложить</button>
  </div>

  <div id="gallery" class="panel active">
    <p id="gallery-status" class="gallery-status wait">
      Нажми на мем — он появится на стриме<br>
      <small>1 мем в минуту с одного аккаунта</small>
    </p>
    <div id="meme-grid" class="grid"></div>
    <p id="gallery-empty" class="empty" style="display:none">Мемов пока нет — предложи первый!</p>
    <p id="gallery-loading" class="status">Загрузка...</p>
  </div>

  <div id="submit" class="panel">
    <div class="form-group">
      <label for="meme-file">Картинка с устройства</label>
      <input id="meme-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
      <img id="meme-preview" class="preview" alt="preview">
    </div>
    <div class="form-group">
      <label for="meme-url">Или ссылка на картинку</label>
      <input id="meme-url" type="url" placeholder="https://.../image.jpg">
    </div>
    <div class="form-group">
      <label for="meme-caption">Подпись (необязательно)</label>
      <textarea id="meme-caption" placeholder="Описание мема..."></textarea>
    </div>
    <button class="btn" id="submit-btn">Отправить на модерацию</button>
    <p class="hint">Или отправь фото в чат с ботом.</p>
    <p class="hint" style="margin-top:4px">v7</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function getApiBase() {
      let base = (new URLSearchParams(location.search).get("api")
        || "https://api.memeapp.osminogr.site").trim().replace(/\/$/, "");
      base = base.replace(/\/api\/memes\/?$/i, "");
      return base;
    }

    const API_BASE = getApiBase();
    const COOLDOWN_MS = 60000;
    let cooldownUntil = 0;
    const galleryStatus = document.getElementById("gallery-status");

    function setGalleryStatus(text, kind) {
      galleryStatus.innerHTML = text;
      galleryStatus.className = "gallery-status " + (kind || "wait");
    }

    function updateCooldownUi() {
      const left = cooldownUntil - Date.now();
      if (left > 0) {
        const sec = Math.ceil(left / 1000);
        setGalleryStatus(
          `Следующий мем через <b>${sec}</b> сек.<br><small>или выберите другой аккаунт</small>`,
          "wait"
        );
        return;
      }
      setGalleryStatus(
        "Нажми на мем — он появится на стриме<br><small>1 мем в минуту</small>",
        "wait"
      );
    }

    setInterval(updateCooldownUi, 500);

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    const fileInput = document.getElementById("meme-file");
    const preview = document.getElementById("meme-preview");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) {
        preview.style.display = "none";
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    async function loadMemes() {
      const grid = document.getElementById("meme-grid");
      const empty = document.getElementById("gallery-empty");
      const loading = document.getElementById("gallery-loading");

      try {
        const res = await fetch(`${API_BASE}/api/memes`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        loading.style.display = "none";

        if (!data.memes || data.memes.length === 0) {
          empty.style.display = "block";
          return;
        }

        data.memes.forEach(meme => {
          const card = document.createElement("div");
          card.className = "meme-card";
          card.innerHTML = `
            <img src="${meme.url}" alt="meme" loading="lazy">
            ${meme.caption ? `<div class="caption">${meme.caption}</div>` : ""}
          `;
          card.addEventListener("click", async () => {
            if (Date.now() < cooldownUntil) {
              updateCooldownUi();
              return;
            }
            setGalleryStatus("Отправляем на стрим...", "wait");
            try {
              const result = await showOnStream(meme.id);
              cooldownUntil = Date.now() + COOLDOWN_MS;
              setGalleryStatus(
                "✓ Мем на стриме! Смотри OBS.<br><small>следующий через 60 сек.</small>",
                "ok"
              );
              tg.HapticFeedback?.impactOccurred("medium");
            } catch (e) {
              const msg = e.message || "Ошибка";
              setGalleryStatus("✗ " + msg, "err");
              const match = msg.match(/(\d+)\s*сек/);
              if (match) {
                cooldownUntil = Date.now() + parseInt(match[1], 10) * 1000;
              }
            }
          });
          grid.appendChild(card);
        });
      } catch (e) {
        loading.textContent = "Не удалось загрузить мемы: " + API_BASE + "/api/memes";
      }
    }

    function getUser() {
      return (tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
    }

    function getAuthorName() {
      const user = getUser();
      if (!user) return "anonymous";
      return [user.first_name, user.last_name].filter(Boolean).join(" ").trim() || user.username || "user";
    }

    function getUserId() {
      const user = getUser();
      return user && user.id ? user.id : 0;
    }

    async function showOnStream(memeId) {
      const res = await fetch(`${API_BASE}/api/obs/show`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          meme_id: memeId,
          user_id: getUserId(),
          user_name: getAuthorName()
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const detail = err.detail;
        throw new Error(typeof detail === "string" ? detail : "Не удалось показать на стриме");
      }
      return await res.json();
    }

    async function submitFileToModeration(file, caption) {
      const form = new FormData();
      form.append("file", file);
      form.append("author", getAuthorName());
      form.append("caption", caption);
      const res = await fetch(`${API_BASE}/api/memes/submit-file`, { method: "POST", body: form });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "Ошибка отправки файла");
      }
      return await res.json();
    }

    async function submitUrlToModeration(url, caption) {
      const form = new FormData();
      form.append("url", url);
      form.append("author", getAuthorName());
      form.append("caption", caption);
      const res = await fetch(`${API_BASE}/api/memes/submit-link`, {
        method: "POST",
        body: form
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const detail = err.detail;
        throw new Error(typeof detail === "string" ? detail : "Ошибка отправки ссылки");
      }
      return await res.json();
    }

    document.getElementById("submit-btn").addEventListener("click", async () => {
      const btn = document.getElementById("submit-btn");
      const urlInput = document.getElementById("meme-url").value.trim();
      const caption = document.getElementById("meme-caption").value.trim();
      const file = fileInput.files[0];

      if (!file && !urlInput) {
        tg.showAlert("Выбери картинку или вставь ссылку");
        return;
      }

      btn.disabled = true;
      try {
        let result;
        if (file) {
          result = await submitFileToModeration(file, caption);
        } else {
          result = await submitUrlToModeration(urlInput, caption);
        }
        const memeId = result.meme && result.meme.id ? result.meme.id : "?";

        tg.showAlert(`Отправлено на модерацию! ID: ${memeId}`);
      } catch (e) {
        tg.showAlert("Ошибка: " + e.message);
        btn.disabled = false;
      }
    });

    loadMemes();
  </script>
</body>
</html>
